<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Boot sequence — cinematic real-time HUD (boot.ts). Two audio tracks:
         #boot-music loops forever (drops to a faint ambient level at the orb
         handoff, never stops); #boot-audio plays the one-shot voice line. -->
    <div id="boot-overlay">
      <audio id="boot-music" preload="auto"></audio>
      <audio id="boot-audio" preload="auto"></audio>
      <div id="boot-hint">select language (top-left) · click to initialize JARVIS</div>
    </div>

    <canvas id="orb-canvas"></canvas>
    <!-- Subtle cinematic vignette over the orb -->
    <div id="vignette"></div>

    <!-- Language toggle — forces speech recognition + replies to a language -->
    <div id="lang-select">
      <button class="lang-btn" data-lang="en" title="English">EN</button>
      <button class="lang-btn active" data-lang="fr" title="Français">FR</button>
      <button class="lang-btn" data-lang="tr" title="Türkçe">TR</button>
    </div>

    <!-- Minimal controls — top right -->
    <div id="controls">
      <button id="btn-avatar" title="Open avatar (new tab)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="7" r="4"/>
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
        </svg>
      </button>
      <button id="btn-mute" title="Mute/Unmute">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button id="btn-menu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <!-- Dropdown menu -->
    <div id="menu-dropdown" style="display:none">
      <button id="btn-settings">Settings</button>
      <button id="btn-restart">Restart Server</button>
      <button id="btn-fix-self">Fix Yourself</button>
    </div>

    <div id="status-text"></div>
    <div id="jarvis-label">JARVIS</div>
    <div id="error-text"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
